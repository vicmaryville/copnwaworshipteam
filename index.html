<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choir Attendance</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #3b0a45, #7b1fa2);
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        background: white;
        color: #333;
        padding: 20px;
        border-radius: 12px;
        max-width: 400px;
        margin: auto;
      }

      h2 {
        color: #7b1fa2;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      button {
        background: #7b1fa2;
        color: white;
        padding: 12px;
        border: none;
        width: 100%;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
      }

      button:hover {
        background: #4a0072;
      }

      .success {
        display: none;
        margin-top: 10px;
        color: green;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <h1>🎉 COPNWA Worship Team</h1>

    <div class="container">
      <h2>Attendance Form</h2>

      <form id="attendanceForm">
        <input type="text" name="fullName" placeholder="Full Name" required />

        <label>Role Type</label>
        <select
          name="roleType"
          id="roleType"
          required
          onchange="updateRoleOptions()"
        >
          <option value="">Select Role Type</option>
          <option value="Singer">Singer</option>
          <option value="Musician">Musician</option>
        </select>

        <div id="roleDetailsContainer" style="display: none">
          <label id="roleLabel">Select Option</label>
          <select name="roleDetail" id="roleDetail" required></select>
        </div>

        <input type="date" name="date" required />

        <select name="status" required>
          <option value="">Attendance Status</option>
          <option>Present</option>
          <option>Absent</option>
        </select>

        <input
          type="number"
          name="contribution"
          placeholder="Contribution Amount ($)"
        />

        <textarea name="notes" placeholder="Notes (Optional)"></textarea>

        <button type="submit">Submit Attendance</button>
        <div class="success" id="successMsg">✅ Submission Successful!</div>
      </form>
    </div>

    <script>
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbyE25o-gL7_oodu9WIOEXWVCmLbOlpvQ4zcJZtuk_tLENh_c-GKQWUBFFgmRtba8C1v/exec";
      const successMsg = document.getElementById("successMsg");

      document
        .getElementById("attendanceForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            body: new FormData(this),
          })
            .then(() => {
              alert("✅ Submission Successful!");
              this.reset();
              document.getElementById("roleDetailsContainer").style.display =
                "none";
            })
            .catch((error) => {
              alert("❌ Submission failed");
              console.error(error);
            });
        });
    </script>
  </body>
</html>
